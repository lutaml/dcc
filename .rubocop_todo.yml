# ---------------------------------------------------------------------------
# Naming — the cop defaults are wrong for this domain
# ---------------------------------------------------------------------------

# The short parameter names RuboCop flags are the conventional ones in this
# code: `q` for a quantity, `a`/`b` for the two sides of a diff, `u`/`u1`/`u2`
# for units being composed, `v` for a version string, `mr` for a measurement
# result. Spelling them out would make the maths harder to read, not easier.
# Widening AllowedNames rather than excluding files, so the rule keeps working
# on genuinely lazy names. This list must repeat the inherited defaults —
# only Exclude is merged across configs, so a bare addition would replace it.
Naming/MethodParameterName:
  AllowedNames:
    - as
    - at
    - by
    - cc
    - db
    - id
    - if
    - in
    - io
    - ip
    - of
    - "on"
    - os
    - pp
    - to
    - a
    - b
    - mr
    - q
    - u
    - u1
    - u2
    - v

# Names like `country_code_iso_3166_1` and `used_lang_code_iso_639_1` come
# from the standards they reference (ISO 3166-1, ISO 639-1) and from the DCC
# XML element names they map to. The cop wants `iso_31661`, which would break
# the link to the schema. These names are not a style choice, so the rule does
# not apply to this codebase at all.
Naming/VariableNumber:
  Enabled: false

# ---------------------------------------------------------------------------
# RSpec — suite-wide style the specs deliberately do not follow
# ---------------------------------------------------------------------------

# RSpec/MultipleExpectations caps an example at ONE expectation. These specs
# check a parsed document by asserting over several of its fields at once,
# which is the point of a round-trip test. Splitting 61 examples into ~200
# would make the suite slower and no clearer. Frozen per file.
