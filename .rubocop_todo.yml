# Deliberate deferrals. Every entry records debt we chose not to pay in the
# CI-green PR, and why. Remove entries as the offenses get fixed.
#
# This file is hand-maintained. Do not regenerate it with
# `rubocop --auto-gen-config` — that drops the reasons and silently widens
# the exclusions to whatever happens to be broken that day.
#
# Per-file `Exclude:` is preferred over `Enabled: false` throughout: it
# freezes the offenses that exist today while keeping the rule live for every
# new file.

# ---------------------------------------------------------------------------
# Architectural: compact module style
# ---------------------------------------------------------------------------

# The library namespaces every model compactly (`module Dcc::V3`), and the
# inherited oss-guides config enforces `nested`. Converting the 116 files to
# nested style changes constant lookup and would collide with every open
# branch, so it is its own PR.
#
# This cop accounts for 372 offenses on its own. Beyond its 116, enabling it
# makes RuboCop emit 256 phantom Layout offenses against the compact-module
# files: 231 Layout/IndentationWidth plus a few Layout/TrailingWhitespace,
# Layout/ArgumentAlignment, Layout/LineLength, Style/StringLiterals and
# Lint/RedundantSafeNavigation. Those are not real — RuboCop reports trailing
# whitespace on lines that have none, and `rubocop -a --only
# Layout/IndentationWidth` finds nothing to correct. All 256 vanish when this
# cop is off, which is why it is disabled outright rather than excluded.
Style/ClassAndModuleChildren:
  Enabled: false

# ---------------------------------------------------------------------------
# Line length
# ---------------------------------------------------------------------------

# 107 lines over the 80-column limit, in 53 files. RuboCop cannot fix these:
# `rubocop -a` corrects 0 of the 107, so every one is a manual rewrap. That
