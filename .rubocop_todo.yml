# Small ones that need a real decision, not a rename
# ---------------------------------------------------------------------------

# Both unused arguments are public keyword parameters. `warning_source:` is
# still passed in by Dcc::VersionedParser, and `xml:` is part of the published
# signature of Dcc::Schema::Version.resolve_dsi. RuboCop wants a leading
# underscore, but for keyword arguments that renames the keyword and breaks
# callers. Removing them is an API change and belongs in its own PR.
Lint/UnusedMethodArgument:
  Exclude:
    - 'lib/dcc/context_options.rb'
    - 'lib/dcc/schema/version.rb'

# The remaining few are judgement calls about existing working code: branches
# that happen to share a body but read better apart, predicate methods whose
# names the cop disputes, `size` on a literal, and an `it` assignment. All are
# cosmetic, none is mechanical, and none belongs in a CI-unblocking PR.
Lint/DuplicateBranch:
  Exclude:
    - 'lib/dcc/convert/liquid_filters.rb'

Naming/PredicateMethod:
  Exclude:
    - 'lib/dcc.rb'
    - 'lib/dcc/server/storage/memory.rb'
    - 'lib/dcc/si/v1.rb'
    - 'lib/dcc/si/v2.rb'
    - 'lib/dcc/v2.rb'
    - 'lib/dcc/v3.rb'

Performance/FixedSize:
  Exclude:
    - 'lib/dcc/cli/formatters.rb'

Style/ItAssignment:
  Exclude:
    - 'lib/dcc/builder/session.rb'

