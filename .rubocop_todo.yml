# ---------------------------------------------------------------------------
# Unsafe autocorrections — each one changes behaviour
# ---------------------------------------------------------------------------

# RuboCop marks all of these "unsafe correctable", meaning the rewrite is not
# behaviour-preserving in general. `rubocop -A` was tried and reverted on this
# branch precisely because an autocorrect pair broke `Dcc::Builder.call`.
# Each of these needs a human to check the surrounding code and, in most
# cases, a test that does not exist yet. Frozen until then, not swept.
#
# Style/SafeNavigation in particular changes `x && x.foo` into `x&.foo`, which
# differs whenever the receiver can be `false` rather than `nil`.
